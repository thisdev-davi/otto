name: otto-validation
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: otto
      POSTGRES_PASSWORD: otto
      POSTGRES_DB: otto_test
    ports:
      - '127.0.0.1:55437:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U otto -d otto_test']
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56382:6379'
