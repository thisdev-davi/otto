name: Validation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: otto
          POSTGRES_PASSWORD: otto
          POSTGRES_DB: otto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otto -d otto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://otto:otto@localhost:5432/otto_test
      DATABASE_DIRECT_URL: postgresql://otto:otto@localhost:5432/otto_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-test-secret-at-least-32-characters
      EVOLUTION_API_KEY: ci-only-evolution-secret-at-least-32-characters
      EVOLUTION_URL: http://127.0.0.1:58084
      LLM_PROVIDER: stub
      LLM_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      EMBEDDINGS_API_KEY: ''
      TRANSCRIPTION_API_KEY: ''
      SQL_ECHO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install exact development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint and format
        run: |
          python -m ruff check app tests scripts alembic
          python -m ruff format --check app tests scripts alembic
      - name: Migrate empty isolated database
        run: alembic upgrade head
      - name: Backend tests without paid or real integrations
        run: >-
          python -m pytest -q --cov=app --cov-report=term
          --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" --cov-fail-under=75

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck, design checks and build
        working-directory: frontend
        run: |
          npm run check
          npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan current tree and complete reachable history with redaction
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --redact --no-banner
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts='--all'
